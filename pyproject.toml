[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repository-aware-coding-agent"
version = "1.0.0"
description = "A controlled, repository-aware AI coding agent"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]
